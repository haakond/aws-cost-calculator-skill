name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate skills against the Agent Skills specification
        run: |
          for skill in skills/*/; do
            pipx run --spec "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate "$skill"
          done

      - name: Validate Agent Plugins manifests (Kiro, Cursor) against their schemas
        run: |
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json mcp.json

      - name: Check plugin manifests are consistent with the skill
        run: python3 scripts/check_manifests.py
