name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate skill against the Agent Skills specification
        run: pipx run --spec "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate skills/aws-cost-calculator

      - name: Check plugin manifests are consistent with the skill
        run: python3 scripts/check_manifests.py
